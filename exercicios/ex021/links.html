<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        /*
        #  = id
        .  = class
        :  = pseudo-class
        :: = pseudo-elemnet
        >  - clildren
        */
        body {
              font-family: Arial, Helvetica, sans-serif;
            }
            a {
                color: red;
                text-decoration: none;
               
            }
           a:hover {
            color: rgb(0, 255, 255);
            text-decoration: underline;
           }
           .especial {
            background-color: rgb(224, 140, 140);
           }
           a:active {
            color: black;
           }
           a::before {
            content: '📲';
           }
          a::after {
             content: '📲';
          }
          
 

    </style>
</head>
<body>
    <h1>Personalizando Linkis</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io/" target="_blank">Reposítorio GitHub</a></li>
        <li><a href="https://www.youtube.com/" class="especial" target="_blank">Youtube</a></li>
        <li><a href="http://alistamento.eb.mil.br/" target="_blank"> Alistamento</a></li>
    </ul>
</body>
</html>
